# Checker selection is deliberately left to the gate's default set.
#
# This file previously carried `checkers:` and `exclude:` keys. Neither is in the
# schema — the decoder discarded them, so the gate never ran what the file claimed.
# The schema's allowlist is `enabledCheckers`, and it has no negative form; omitting
# it means "run the default selection", which is what was happening anyway. Excluding
# a single checker is a `--exclude` flag on the command line, not a file setting.

consistency:
  # A literal path, relative to this repository's root. Relative on purpose: this repository is
  # public, and the 2026-09-12 history remediation removed the absolute path that used to be
  # here. It was replaced then with `${ORG_JUDGEMENT_CORPUS:-}`, which the gate does not expand
  # — nothing in this file is passed through a shell — so every run since wrote its telemetry
  # into a directory with that literal name inside this checkout, and `consistency` passed by
  # skipping. Where the corpus is not checked out beside the code, the checker says it could
  # not check; it does not fail.
  corpusPath: ../../../Tools/org-judgement-corpus
  projectID: BusinessMathExcel
  consistencyThreshold: 0.7
  defaultRiskTier: 2

# v2 layout: the master plan is project-owned, not framework content.
status:
  guidelinesPath: "."
  masterPlanPath: project/master_plan.md

# Refuse to trust a gate binary older than this. A stale binary silently runs
# old rules; without this pin nothing says so. Ratchet on each deploy that the
# repo depends on. Warns on every run; fails only under --strict.
minimumGateVersion: "2026-09-03"

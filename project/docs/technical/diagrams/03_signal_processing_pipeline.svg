font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="58.4858" x="26" y="159.9023">BioSample</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="298.6758" x="26" y="173.271">(rrInterval: ms, timestamp: ContinuousClock.Instant)</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="22" x="26" y="186.6396">&#8212;&#8212;</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="230.667" x="26" y="200.0083">Device adapter creates one per heartbeat</text><line style="stroke:#000000;stroke-width:1;" x1="10" x2="10" y1="80.4746" y2="1170.9072"/><rect fill="#FFFFE0" height="1090.4326" style="stroke:#FFFFE0;stroke-width:1;" width="335.7065" x="542.8667" y="80.4746"/><rect fill="#F0F0F0" height="100.2119" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:1;" width="325.7065" x="548.8667" y="232.3179"/><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="162.4111" x="558.8667" y="253.377">RRBuffer&lt;MedianMalikFilter&gt;</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="22" x="558.8667" y="266.7456">&#8212;&#8212;</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="241.9355" x="558.8667" y="280.1143">1. Range gate: 300-2000 ms (30-200 BPM)</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="305.7065" x="558.8667" y="293.4829">2. Ectopic filter: |rr &#8722; median(last 5)| / median &lt; 20%</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="22" x="558.8667" y="306.8516">&#8212;&#8212;</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="242.6123" x="558.8667" y="320.2202">Output: cleaned BioSample or nil (rejected)</text><rect fill="#F0F0F0" height="46.7373" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:1;" width="257.2036" x="583.1182" y="352.5298"/><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="152.9043" x="593.1182" y="373.5889">StreamingCoherenceEngine</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="237.2036" x="593.1182" y="386.9575">appends to 60-second rolling buffer (FIFO)</text><line style="stroke:#000000;stroke-width:1;" x1="542.8667" x2="542.8667" y1="80.4746" y2="1170.9072"/><rect fill="#F08080" height="1090.4326" style="stroke:#F08080;stroke-width:1;" width="145.9243" x="878.5732" y="80.4746"/><rect fill="#F0F0F0" height="100.2119" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:1;" width="135.9243" x="884.5732" y="419.2671"/><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="62.7666" x="894.5732" y="440.3262">HRVMetrics</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="22" x="894.5732" y="453.6948">&#8212;&#8212;</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="73.8633" x="894.5732" y="467.0635">&#8226; rmssd (ms)</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="66.6606" x="894.5732" y="480.4321">&#8226; sdnn (ms)</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="115.9243" x="894.5732" y="493.8008">&#8226; pnn50 (proportion)</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="86.2705" x="894.5732" y="507.1694">&#8226; meanRR (ms)</text><line style="stroke:#000000;stroke-width:1;" x1="878.5732" x2="878.5732" y1="80.4746" y2="1170.9072"/><rect fill="#F08080" height="1090.4326" style="stroke:#F08080;stroke-width:1;" width="209.2012" x="1024.4976" y="80.4746"/><rect fill="#F0F0F0" height="167.0552" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:1;" width="199.2012" x="1030.4976" y="539.479"/><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="138.9072" x="1040.4976" y="560.5381">FrequencyDomainMetrics</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="22" x="1040.4976" y="573.9067">&#8212;&#8212;</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="179.2012" x="1040.4976" y="587.2754">&#8226; Resample &#8594; 4 Hz uniform grid</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="143.4136" x="1040.4976" y="600.644">&#8226; Mean removal / detrend</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="100.8745" x="1040.4976" y="614.0127">&#8226; Hann windowing</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="70.6514" x="1040.4976" y="627.3813">&#8226; FFT &#8594; PSD</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="106.7021" x="1040.4976" y="640.75">&#8226; Band integration:</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="108.6895" x="1055.9663" y="654.1187">VLF: 0.003-0.04 Hz</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="98.0439" x="1055.9663" y="667.4873">LF:  0.04-0.15 Hz</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="100.187" x="1055.9663" y="680.856">HF:  0.15-0.40 Hz</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="134.0518" x="1040.4976" y="694.2246">&#8226; lfHfRatio, lfNormalized</text><line style="stroke:#000000;stroke-width:1;" x1="1024.4976" x2="1024.4976" y1="80.4746" y2="1170.9072"/><rect fill="#F5DEB3" height="1090.4326" style="stroke:#F5DEB3;stroke-width:1;" width="501.9131" x="1233.6987" y="80.4746"/><path d="M1529.4814,764.9558 L1529.4814,786.0088 L1509.4814,790.0088 L1529.4814,794.0088 L1529.4814,815.0618 A0,0 0 0 0 1529.4814,815.0618 L1730.6118,815.0618 A0,0 0 0 0 1730.6118,815.0618 L1730.6118,774.9558 L1720.6118,764.9558 L1529.4814,764.9558 A0,0 0 0 0 1529.4814,764.9558" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M1720.6118,764.9558 L1720.6118,774.9558 L1730.6118,774.9558 L1720.6118,764.9558" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="109.3555" x="1535.4814" y="781.0149">[Cl. 7, 18, 33, 44]</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="156.8252" x="1535.4814" y="794.3835">"analysis of physiologic data</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="180.1304" x="1535.4814" y="807.7522">to determine increase/decrease"</text><rect fill="#F0F0F0" height="126.9492" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:1;" width="269.7827" x="1239.6987" y="726.5342"/><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="155.5146" x="1249.6987" y="747.5933">CoherenceAlgorithm.score()</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="22" x="1249.6987" y="760.9619">&#8212;&#8212;</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="195.4756" x="1249.6987" y="774.3306">1. Find peak in PSD [0.04-0.26 Hz]</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="249.7827" x="1249.6987" y="787.6992">2. Integrate power around peak (&#177;0.015 Hz)</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="164.0063" x="1249.6987" y="801.0679">3. Integrate total band power</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="204.9985" x="1249.6987" y="814.4365">4. ratio = peak_power / band_power</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="237.6655" x="1249.6987" y="827.8052">5. coherence = clamp(ratio &#215; 100, 0, 100)</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="218.5552" x="1249.6987" y="841.1738">6. breathingRate = peakFreq &#215; 60 BPM</text><line style="stroke:#000000;stroke-width:1;" x1="1233.6987" x2="1233.6987" y1="80.4746" y2="1170.9072"/><rect fill="#F5DEB3" height="1090.4326" style="stroke:#F5DEB3;stroke-width:1;" width="451.2529" x="1735.6118" y="80.4746"/><path d="M2011.8867,905.2207 L2011.8867,919.5894 L1991.8867,923.5894 L2011.8867,927.5894 L2011.8867,941.958 A0,0 0 0 0 2011.8867,941.958 L2181.8647,941.958 A0,0 0 0 0 2181.8647,941.958 L2181.8647,915.2207 L2171.8647,905.2207 L2011.8867,905.2207 A0,0 0 0 0 2011.8867,905.2207" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M2171.8647,905.2207 L2171.8647,915.2207 L2181.8647,915.2207 L2171.8647,905.2207" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="117.1758" x="2017.8867" y="921.2798">[Cl. 10, 11, 36, 37]</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="148.978" x="2017.8867" y="934.6484">Fixed + adaptive threshold</text><rect fill="#F0F0F0" height="100.2119" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:1;" width="250.2749" x="1741.6118" y="873.4834"/><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="87.3125" x="1751.6118" y="894.5425">EMA Smoothing</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="22" x="1751.6118" y="907.9111">&#8212;&#8212;</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="213.7695" x="1751.6118" y="921.2798">smoothed = &#945; &#215; raw + (1 &#8722; &#945;) &#215; prev</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="183.7344" x="1751.6118" y="934.6484">&#945; default = 0.3 (user-adjustable)</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="22" x="1751.6118" y="948.0171">&#8212;&#8212;</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="230.2749" x="1751.6118" y="961.3857">Warmup gate: no output until &#8805; 30s data</text><line style="stroke:#000000;stroke-width:1;" x1="1735.6118" x2="1735.6118" y1="80.4746" y2="1170.9072"/><rect fill="#90EE90" height="1090.4326" style="stroke:#90EE90;stroke-width:1;" width="415.5781" x="2186.8647" y="80.4746"/><rect fill="#F0F0F0" height="73.4746" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:1;" width="257.7891" x="2192.8647" y="993.6953"/><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="92.6084" x="2202.8647" y="1014.7544">CoherenceResult</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="22" x="2202.8647" y="1028.123">&#8212;&#8212;</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="237.7891" x="2202.8647" y="1041.4917">coherence, breathingRate, peakFrequency,</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="189.4492" x="2202.8647" y="1054.8604">rmssd, lfPower, hfPower, lfHfRatio</text><path d="M2397.376,1078.8013 L2397.376,1099.8542 L2377.376,1103.8542 L2397.376,1107.8542 L2397.376,1128.9072 A0,0 0 0 0 2397.376,1128.9072 L2597.4429,1128.9072 A0,0 0 0 0 2597.4429,1128.9072 L2597.4429,1088.8013 L2587.4429,1078.8013 L2397.3